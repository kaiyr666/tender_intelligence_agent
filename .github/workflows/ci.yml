name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Eval (offline, no API key)
        run: |
          if [ -n "${EVAL_NEEDS_API:-}" ]; then echo "Eval needs an API key; skipped in CI."; else uv run python -m evals.run; fi
        env:
          EVAL_NEEDS_API: ${{ vars.EVAL_NEEDS_API }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .
